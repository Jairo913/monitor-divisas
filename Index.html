<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Divisas</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <header>
        <h1>Monitor de Divisas</h1>
        <p id="fecha">Cargando fecha...</p>
    </header>

    <main class="contenedor-tasas">
        <div class="tarjeta" id="bcv">
            <h2>Dólar BCV</h2>
            <p class="precio">Bs. --</p>
        </div>
        <div class="tarjeta" id="usdt">
            <h2>USDT (Binance)</h2>
            <p class="precio">Bs. --</p>
        </div>
        <div class="tarjeta" id="euro">
            <h2>Euro BCV</h2>
            <p class="precio">Bs. --</p>
        </div>
    </main>

    <div class="modulo-carga">
        <button id="btn-actualizar">Actualizar Tasas</button>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
